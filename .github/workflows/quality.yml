name: Project quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-app:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-notebook.txt
      - run: python -c "import streamlit, nbformat"
      - run: python scripts/build_notebook.py
      - run: python scripts/build_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('notebook.ipynb', as_version=4))"
