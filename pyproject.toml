[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-success-semester-one"
version = "1.0.0"
description = "Retrospective student outcome prediction and review support after semester one"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["student_success*"]
